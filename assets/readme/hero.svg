<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">oss-contribution-skill：把一次开源贡献拆成五个阶段，并留下证据</title>
  <desc id="hero-desc">纸面文档风格的标题图。上方是仓库名 oss-contribution-skill 与一句话说明：先确认项目值得做，再确认做什么，最后才动代码。中部是五个阶段：项目筛查、机会调研、方案设计、受控实现、PR 描述，其中方案设计标记为当前阶段。底部是任务卡状态行：基线 main@3f9c1ab，核查日期 2026-11-03，待决定 1 项，以及 PR 默认只出草稿的标注。</desc>

